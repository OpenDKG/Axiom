name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Release packaging calls this workflow so a release is gated on the same full suite.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PSExecutionPolicyPreference: Bypass

jobs:
  build-and-test:
    name: Build, Analyze & Test (Windows)
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          global-json-file: global.json

      - name: Set up portable Python 3.12 for agent hook runtime tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $pyRoot = Join-Path $env:RUNNER_TOOL_CACHE 'python-3.12.9'
          $pyTools = Join-Path $pyRoot 'tools'
          $pyExe = Join-Path $pyTools 'python.exe'
          if (-not (Test-Path $pyExe)) {
            $tmpZip = Join-Path $env:RUNNER_TEMP 'python.3.12.9.zip'
            Remove-Item $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/python/3.12.9' -OutFile $tmpZip
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($tmpZip, $pyRoot)
            Remove-Item $tmpZip -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $pyExe)) { throw "Python binary missing at $pyExe" }
          $pyTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Environment
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          dotnet --version
          dotnet --info | Select-Object -First 25
          python -c "import sys; print(sys.executable, sys.version)"

      - name: Require every workflow action to be pinned to a commit SHA
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          .\scripts\test-verify-action-pins.ps1
          .\scripts\verify-action-pins.ps1

      - name: Restore solution (locked mode, portable + Windows)
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          dotnet restore Axiom.Portable.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Portable locked-mode restore failed with exit code $LASTEXITCODE" }
          dotnet restore Axiom.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Full solution locked-mode restore failed with exit code $LASTEXITCODE" }

      - name: Release build (analyzers & TreatWarningsAsErrors)
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: dotnet build Axiom.sln -c Release --no-restore

      - name: Run full test suite (strict pass/skip gate)
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $resultsDir = Join-Path $env:RUNNER_TEMP 'test-results'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null

          dotnet test Axiom.sln -c Release --no-build -m:1 --logger "trx" --results-directory $resultsDir
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test failed with exit code $LASTEXITCODE"
          }

          $trxFiles = Get-ChildItem -Path $resultsDir -Filter *.trx -Recurse
          if (-not $trxFiles) {
            throw "No TRX test reports were produced."
          }

          $totalExecuted = 0
          $totalPassed = 0
          $totalFailed = 0
          $totalSkipped = 0

          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add("## Windows CI Test Summary")
          $summary.Add("| Suite | Executed | Passed | Failed | Skipped |")
          $summary.Add("|---|---:|---:|---:|---:|")

          foreach ($trx in $trxFiles | Sort-Object Name) {
            [xml]$doc = Get-Content -LiteralPath $trx.FullName
            $c = $doc.TestRun.ResultSummary.Counters
            $executed = [int]$c.executed
            $passed = [int]$c.passed
            $failed = [int]$c.failed
            $skipped = [int]$c.total - $executed

            $totalExecuted += $executed
            $totalPassed += $passed
            $totalFailed += $failed
            $totalSkipped += $skipped

            $summary.Add("| $($trx.Name) | $executed | $passed | $failed | $skipped |")
          }

          $summary.Add("| **Total** | **$totalExecuted** | **$totalPassed** | **$totalFailed** | **$totalSkipped** |")
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($totalFailed -gt 0 -or $totalSkipped -gt 0 -or $totalPassed -eq 0) {
            throw "Strict test gate failed: executed=$totalExecuted passed=$totalPassed failed=$totalFailed skipped=$totalSkipped"
          }

      - name: Check for vulnerable NuGet packages
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $output = dotnet list Axiom.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet list package --vulnerable failed with exit code $LASTEXITCODE"
          }
          if ($output -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet package(s) detected."
          }

      - name: Validate notices, licenses & starter feed integrity
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          foreach ($required in @('LICENSE', 'NOTICE', 'AUTHORS.md', 'THIRD_PARTY_NOTICES.md', 'community/feed.json',
              'packaging/licenses/native-binaries.json', 'packaging/licenses/dotnet/DOTNET-LIBRARY-LICENSE.txt')) {
            if (-not (Test-Path $required)) {
              throw "Required legal/bundle file missing: $required"
            }
          }

          $feed = Get-Content 'community/feed.json' -Raw | ConvertFrom-Json
          if (-not $feed.entries -or $feed.entries.Count -lt 1) {
            throw "community/feed.json must contain at least one valid entry."
          }

      - name: Upload TRX test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: ${{ runner.temp }}/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  packaging-verification:
    name: Setup Packaging & Safe CLI Check
    needs: build-and-test
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          global-json-file: global.json

      - name: Publish single-file Axiom Setup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: .\scripts\publish-setup.ps1

      - name: Native binary check fails when something is missing
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: .\scripts\test-verify-publish-natives.ps1 -PublishDir artifacts\publish\win-x64, artifacts\publish\service, artifacts\publish\setup

      - name: Published desktop app and service start
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: .\scripts\smoke-published.ps1 -Desktop artifacts\publish\win-x64\Axiom.Desktop.exe -Service artifacts\publish\service\Axiom.Service.exe

      - name: A multi-file publish does not contain DiaSymReader
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'service-multi-file'
          dotnet publish src\Axiom.Service\Axiom.Service.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true `
              -p:RestoreLockedMode=false -p:RestorePackagesWithLockFile=true -p:NuGetLockFilePath=obj/publish.packages.lock.json `
              -p:PublishSingleFile=false -o $out
          if ($LASTEXITCODE -ne 0) { throw "Multi-file publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $out 'coreclr.dll'))) { throw "Expected a multi-file publish with coreclr.dll" }
          if (Get-ChildItem $out -Recurse -Filter 'Microsoft.DiaSymReader.Native.*') { throw "DiaSymReader was published" }
          if (Select-String -LiteralPath (Join-Path $out 'Axiom.Service.deps.json') -SimpleMatch 'DiaSymReader.Native' -Quiet) {
            throw "deps.json still lists DiaSymReader"
          }

      - name: Verify installer binary, hash & silent acceptance guard
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $setupExe = 'artifacts\publish\setup\Axiom.Setup.exe'
          if (-not (Test-Path $setupExe)) {
            throw "Expected installer binary was not produced: $setupExe"
          }

          $sizeBytes = (Get-Item $setupExe).Length
          if ($sizeBytes -lt 50MB -or $sizeBytes -gt 125MB) {
            throw "Unexpected Axiom.Setup.exe size: $sizeBytes bytes"
          }

          $hash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash
          Write-Host "Axiom.Setup.exe: $sizeBytes bytes, SHA256=$hash"

          # Verify silent mode refuses unattended install without explicit --accept-risk (exit code 2).
          $proc = Start-Process -FilePath (Resolve-Path $setupExe) -ArgumentList '--silent' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 2) {
            throw "Expected Axiom.Setup.exe --silent without --accept-risk to exit with code 2, got $($proc.ExitCode)"
          }

          @(
            "## Setup Packaging Check",
            "- Binary: ``Axiom.Setup.exe`` ($sizeBytes bytes)",
            "- SHA-256: ``$hash``",
            "- Silent consent gate (``--silent`` without ``--accept-risk``): exit code ``$($proc.ExitCode)``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # The release script otherwise runs only for a tag. The version is a placeholder.
      - name: Release script and portable install carry the license texts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'release'
          .\scripts\build-release.ps1 -Version 99.0.0 -OutputDir $release
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath (Join-Path $release 'Axiom-99.0.0-win-x64.zip') -DestinationPath $unpacked
          $documents = 'LICENSE', 'NOTICE', 'AUTHORS.md', 'THIRD_PARTY_NOTICES.md'
          $dotnetTexts = 'dotnet\DOTNET-LIBRARY-LICENSE.txt', 'dotnet\LICENSE.TXT', 'dotnet\THIRD-PARTY-NOTICES.TXT'
          foreach ($file in $documents + @($dotnetTexts | ForEach-Object { "licenses\$_" })) {
            if (-not (Test-Path (Join-Path $unpacked $file))) { throw "The release ZIP lacks $file" }
          }

          $install = Join-Path $env:RUNNER_TEMP 'portable-install'
          .\scripts\install-portable.ps1 -Source (Join-Path $unpacked 'Axiom.Desktop.exe') -InstallDir $install -NoShortcut
          foreach ($file in $documents + $dotnetTexts) {
            if (-not (Test-Path (Join-Path $install "licenses\$file"))) { throw "The portable install lacks licenses\$file" }
          }
          Set-Content -LiteralPath (Join-Path $install 'licenses\kept.txt') -Value 'not installed by Axiom'
          .\scripts\uninstall-portable.ps1 -InstallDir $install
          $left = @(Get-ChildItem -LiteralPath $install -Recurse -File | ForEach-Object { $_.Name })
          if (($left -join ',') -ne 'kept.txt') { throw "Unexpected files after uninstall: $($left -join ', ')" }
