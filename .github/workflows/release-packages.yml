name: Release packages

on:
  push:
    branches:
      - 'codex/release-*-linux-preview'
      - 'codex/release-*-macos-preview'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  # The Windows package is built only after the complete Windows CI workflow passes for the same
  # commit: locked restore, analyzer build, every test project in Axiom.sln with the strict
  # pass/skip gate, the vulnerable-package check and the setup packaging check.
  windows-ci:
    if: ${{ !endsWith(github.ref_name, '-preview') }}
    uses: ./.github/workflows/windows-ci.yml

  windows:
    needs: windows-ci
    if: ${{ !endsWith(github.ref_name, '-preview') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Package Windows x64
        run: |
          ./scripts/build-release.ps1 -OutputDir "$PWD/release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          $setup = Get-Item -LiteralPath release/Axiom-Setup.exe
          if ($setup.VersionInfo.ProductVersion -ne $version) { throw 'Windows setup version does not match source' }
          git rev-parse HEAD | Set-Content release/SOURCE-COMMIT.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axiom-windows-x64
          path: release/
          if-no-files-found: error
          compression-level: 0

  linux:
    if: ${{ !endsWith(github.ref_name, '-preview') || endsWith(github.ref_name, '-linux-preview') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkexec
          mkdir -p "$RUNNER_TEMP/axiom-bpftool"
          curl --fail --silent --show-error --location \
            https://github.com/libbpf/bpftool/releases/download/v7.8.1/bpftool-v7.8.1-amd64.tar.gz \
            -o "$RUNNER_TEMP/axiom-bpftool.tar.gz"
          printf '%s  %s\n' 112026bbdf48d0d00ccfc4926e59878d47943f97c197f959f110abe29c898ddc \
            "$RUNNER_TEMP/axiom-bpftool.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/axiom-bpftool.tar.gz" -C "$RUNNER_TEMP/axiom-bpftool"
          bpftool=$(find "$RUNNER_TEMP/axiom-bpftool" -name bpftool -type f -print -quit)
          chmod u+x "$bpftool"
          "$bpftool" version
          echo "BPFTOOL=$bpftool" >> "$GITHUB_ENV"
      - name: Full portable and Linux test suites
        run: |
          dotnet restore Axiom.Portable.slnx --locked-mode
          dotnet build Axiom.Portable.slnx -c Release --no-restore
          dotnet test Axiom.Portable.slnx -c Release --no-build --no-restore -m:1
          dotnet test tests/Axiom.Desktop.Avalonia.Linux.Tests -c Release
          dotnet test tests/Axiom.Infrastructure.Linux.Tests -c Release
          dotnet test tests/Axiom.Service.Unix.Tests -c Release
          dotnet test tests/Axiom.UI.Avalonia.Tests -c Release --filter 'FullyQualifiedName~AgentsViewLogoTests|FullyQualifiedName~UpdateIndicatorAndContactTests'
      - name: Package and verify Ubuntu amd64
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test -n "$version"
          bash scripts/linux/package.sh deb --arch x64
          package="build/linux/axiom-firewall_${version}_amd64.deb"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb -c "$package" > package-contents.txt
          grep -F './usr/lib/axiom-firewall/axiomd/bpf/axiom_connect.bpf.o' package-contents.txt
          mkdir -p release
          git rev-parse HEAD > release/SOURCE-COMMIT.txt
          cp "$package" release/
          cd release
          sha256sum "$(basename "$package")" > SHA256SUMS.txt
      - name: Install the package and smoke-test axiomd and Axiom
        run: scripts/linux/smoke-install.sh build/linux/axiom-firewall_*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axiom-linux-amd64
          path: release/
          if-no-files-found: error
          compression-level: 0

  macos:
    if: ${{ !endsWith(github.ref_name, '-preview') || endsWith(github.ref_name, '-macos-preview') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            expected_arch: x86_64
            artifact: axiom-macos-intel
          - runner: macos-15
            rid: osx-arm64
            expected_arch: arm64
            artifact: axiom-macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Full portable and macOS test suites
        run: |
          dotnet restore Axiom.Portable.slnx --locked-mode
          dotnet build Axiom.Portable.slnx -c Release --no-restore
          dotnet test Axiom.Portable.slnx -c Release --no-build --no-restore -m:1
          mkdir -p "$RUNNER_TEMP/axiom"
          export TMPDIR="$RUNNER_TEMP/axiom"
          bash macos/build.sh test
          dotnet test tests/Axiom.UI.Avalonia.Tests -c Release --filter 'FullyQualifiedName~AgentsViewLogoTests|FullyQualifiedName~UpdateIndicatorAndContactTests'
      - name: Package, sign and verify ${{ matrix.rid }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test -n "$version"
          build=26
          AXIOM_BUILD="$build" bash scripts/macos/package-app.sh ${{ matrix.rid }} --build-filter
          app=build/macos/${{ matrix.rid }}/Axiom.app
          codesign --verify --deep --strict "$app"
          test -d "$app/Contents/Library/SystemExtensions/com.axiom.firewall.filter.systemextension"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          test "$(lipo -archs "$app/Contents/MacOS/Axiom")" = "${{ matrix.expected_arch }}"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "$build"
          extension_info="$app/Contents/Library/SystemExtensions/com.axiom.firewall.filter.systemextension/Contents/Info.plist"
          test "$(plutil -extract CFBundleVersion raw "$extension_info")" = "$build"
      - name: Smoke-start the ${{ matrix.rid }} app bundle
        run: |
          app=build/macos/${{ matrix.rid }}/Axiom.app
          "$app/Contents/MacOS/Axiom" > "$RUNNER_TEMP/axiom-app.log" 2>&1 &
          app_pid=$!
          sleep 20
          if ! kill -0 "$app_pid"; then
            cat "$RUNNER_TEMP/axiom-app.log" >&2 || true
            echo "Axiom.app exited during the startup smoke window" >&2
            exit 1
          fi
          kill "$app_pid" || true
          wait "$app_pid" 2>/dev/null || true
      - name: Zip, checksum and hand off the bundle
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test -n "$version"
          build=26
          app=build/macos/${{ matrix.rid }}/Axiom.app
          package="Axiom-$version-$build-${{ matrix.rid }}-adhoc.zip"
          mkdir -p release
          git rev-parse HEAD > release/SOURCE-COMMIT.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/$package"
          cd release
          shasum -a 256 "$package" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          if-no-files-found: error
          compression-level: 0
