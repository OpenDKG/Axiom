name: Claude Code Review (opt-in)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-claude-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify Windows runner prerequisites
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME, OS: $env:RUNNER_OS"
          $git = Get-Command git -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $bash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $bash)) {
            throw 'Git Bash is required to execute the Claude Code composite action. Install Git for Windows on this runner.'
          }
          & $bash --version


  on-demand-audit:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude read-only audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Read-only code and security audit for Axiom. Never create, edit or delete files, change branches, commit, push, merge, or deploy. Report evidence-backed issues with file paths and lines, severity, impact, and proposed remediation. Pay special attention to Windows firewall rule safety, DNS leaks, administrator privileges, IPC access control, command execution, security boundaries for local AI agents, local telemetry privacy, Blackbox integration, Avalonia portability and regression tests. Never recommend publishing personal or local network activity to a shared graph."

  labeled-pr-review:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'claude-review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review of labeled PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the changed code and surrounding context in this Axiom pull request.
            This is an audit-only review: do not edit files, create commits,
            push changes, open new pull requests, merge or deploy.

            Check for:
            - security vulnerabilities, authorization and privilege-boundary failures;
            - unsafe Windows firewall, DNS, process-launch and IPC behavior;
            - agent tool-call protection, prompt-injection and secret-exposure risks;
            - unintended network/agent telemetry disclosure or DKG publication;
            - concurrency, resource leaks, error handling and performance issues;
            - WPF/Avalonia regressions, platform compatibility and missing tests.

            Rank findings as critical/high/medium/low, and include path, line,
            exploit or failure scenario and specific remediation. Avoid speculative
            findings. Post actionable inline comments with
            mcp__github_inline_comment__create_inline_comment and a concise
            PR summary with gh pr comment. If there are no actionable findings,
            explicitly say so.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Read-only security reviewer for Axiom. Never modify repository content, commit, push, merge or deploy."
