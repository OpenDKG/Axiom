# Opt-in drop-in for per-executable firewall enforcement.
#
# The base unit sets ProtectControlGroups=true, which makes the cgroup v2 hierarchy read-only and
# therefore prevents attaching the eBPF programs. Install this file only on a host where the
# operator has explicitly decided to use Axiom's firewall feature.
#
# Enforcement also requires the write gate in the unit environment:
#   Environment=AXIOM_ENABLE_FIREWALL_WRITES=1
#   Environment=AXIOM_FIREWALL_WRITE_CONFIRM=yes
# and libbpf1 plus a kernel with BTF and cgroup v2. Without all of it the capability report stays
# truthful and no rule is written.
[Service]
ProtectControlGroups=false
